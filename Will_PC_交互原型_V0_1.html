.theme-switch button.active{background:var(--blue-strong);color:#fff}
.settings-theme{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
:root[data-theme="light"] .theme-switch{border-color:#c8d5df;background:#f2f6f8}
:root[data-theme="light"] .theme-switch button:hover{background:#e3eef3;color:#294353}
:root[data-theme="light"] .theme-switch button.active{background:#267db9;color:#fff}
</style>

<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>

<div id="app"></div>
<div id="portal"></div>
<div id="toast" role="status" aria-live="polite" class="toast hide"></div>
<script>
(()=>{'use strict';
const KEY='will-pc-ui-demo-v01';
const THEME_KEY='will-pc-theme-v01';
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const weekChars=['日','一','二','三','四','五','六'];
function dateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateAdd(date,days){let d=typeof date==='string'?new Date(date+'T12:00:00'):new Date(date);d.setDate(d.getDate()+days);return dateStr(d)}
function dt(s){return new Date(s+'T12:00:00')}
const nowStr=dateStr(TODAY);
function id(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const projects=[{id:'will',name:'Will 客户端',description:'周六原型展示',color:'#76b7e8'},{id:'course',name:'课程与学习',description:'课程及个人学习事项',color:'#c6aaed'},{id:'personal',name:'个人事务',description:'日常安排',color:'#9ed5ae'}];
function seed(){return {username:'同学',tasks:[
{id:'t1',title:'确认核心交互流程',due:dateAdd(nowStr,-1),time:'18:00',projectId:'will',done:true},
{id:'t2',title:'完善首页布局',due:nowStr,time:'20:00',projectId:'will',done:false},
{id:'t3',title:'准备周六的原型演示',due:dateAdd(nowStr,4),time:'10:00',projectId:'will',done:false},
{id:'t4',title:'整理课程报告',due:dateAdd(nowStr,2),time:'17:00',projectId:'course',done:false},
{id:'t5',title:'整理调研反馈',due:dateAdd(nowStr,5),time:'18:00',projectId:'will',done:false}
],events:[
{id:'e1',title:'技术组讨论',date:dateAdd(nowStr,1),time:'15:00',duration:60,projectId:'will',remind:30},
{id:'e2',title:'客户端演示验收',date:dateAdd(nowStr,3),time:'16:00',duration:60,projectId:'will',remind:60}
]}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.tasks)&&Array.isArray(o.events))return o}catch(e){}return seed()}
function loadTheme(){try{const value=localStorage.getItem(THEME_KEY);if(['light','night','system'].includes(value))return value}catch(e){}return 'night'}
function resolveTheme(mode){return mode==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'night':'light'):mode}
function applyTheme(){const resolved=resolveTheme(themeMode);document.documentElement.dataset.theme=resolved;document.documentElement.dataset.themeMode=themeMode;document.documentElement.style.colorScheme=resolved==='light'?'light':'dark'}
function setTheme(mode){themeMode=['light','night','system'].includes(mode)?mode:'system';try{localStorage.setItem(THEME_KEY,themeMode)}catch(e){}applyTheme();render();toast(`已切换为${themeName(themeMode)}主题`)}
function themeName(mode){return mode==='light'?'日间':mode==='night'?'夜间':'跟随系统'}
function themeIcon(mode){return mode==='light'?'sun':mode==='night'?'moon':'monitor'}
let themeMode=loadTheme();let data=load();let view='home',selectedDate=nowStr,calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);let drawer=false,plusMenu=false,composerText='',conversation=[],pending=[],pendingSource='',processing=false,dialog=null;let timer;
const el=document.getElementById('app'),portal=document.getElementById('portal');
applyTheme();
if(window.matchMedia){const media=window.matchMedia('(prefers-color-scheme: dark)');media.addEventListener?.('change',()=>{if(themeMode==='system'){applyTheme();render()}})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name,cls=''){return `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`}
function project(pid){return projects.find(p=>p.id===pid)||projects[0]}
function formatShort(s){if(!s)return '未设置';const d=dt(s);return `${d.getMonth()+1}/${d.getDate()}（周${weekChars[d.getDay()]}）`}
function formattedLong(s){const d=dt(s);return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${weekChars[d.getDay()]}`}
function compareDue(t){return `${t.due||'9999-12-31'} ${t.time||'23:59'}`}
function sortedTasks(a){return [...a].sort((x,y)=>Number(x.done)-Number(y.done)||compareDue(x).localeCompare(compareDue(y)))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('浏览器限制了本地存储，数据仅在当前页面有效。')}}
function metrics(){return {done:data.tasks.filter(t=>t.done).length,total:data.tasks.length,overdue:data.tasks.filter(t=>!t.done&&t.due<nowStr).length,upcoming:data.tasks.filter(t=>!t.done&&t.due>=nowStr&&t.due<=dateAdd(nowStr,3)).length}}
function projectMetrics(pid){let x=data.tasks.filter(t=>t.projectId===pid);return {done:x.filter(t=>t.done).length,total:x.length,percent:x.length?Math.round(x.filter(t=>t.done).length/x.length*100):0}}
function progress(p){return `<div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,p))}%"></div></div>`}
function nav(){let items=[['home','home','首页'],['calendar','calendar','日历'],['projects','tasks','项目'],['settings','settings','设置']];return `<aside class="rail"><button class="brand-logo" data-nav="home" title="Will 首页">W.</button><div class="rail-sep"></div>${items.map(([v,ic,t])=>`<button class="nav-button ${view===v?'active':''}" data-nav="${v}" aria-label="${t}" title="${t}">${icon(ic)}<span>${t}</span></button>`).join('')}<div class="rail-bottom"><button class="nav-button" data-act="reset" title="恢复演示数据">${icon('reload')}<span>重置</span></button></div></aside>`}
function top(){let titles={home:'我的工作台',calendar:'日历安排',projects:'项目与待办',settings:'个人设置'};return `<header class="topbar"><div><div class="eyebrow">WILL / PC PROTOTYPE</div><div class="page-name">${titles[view]}</div></div><div class="top-actions"><span class="pill live">${icon('check','sm')} 离线可演示</span><button class="surface-btn small" data-act="show-help">${icon('info','sm')} 使用说明</button><button class="surface-btn small" data-nav="settings">${icon('user','sm')} ${esc(data.username||'同学')}</button><button class="surface-btn small" data-act="cycle-theme" title="切换日间 / 夜间主题">${icon(themeIcon(themeMode),'sm')} ${themeName(themeMode)}</button><button class="primary-btn small" data-act="open-assistant">${icon('sparkle','sm')} AI 助手</button></div></header>`}
// 顶部栏统一显示页名，内容区不再重复标题、介绍和添加按钮。
function pageHeader(){return ''}
function home(){let m=metrics(),done=m.total?Math.round(m.done/m.total*100):0;let nearest=sortedTasks(data.tasks.filter(t=>!t.done)).slice(0,4);
return `${pageHeader(`晚上好，${esc(data.username)}。`,`今天是 ${formattedLong(nowStr)}。从最重要的事情开始吧。`,`<button class="surface-btn" data-act="new-item">${icon('plus','sm')} 手动添加</button>`)}<div class="content-grid"><main class="column"><section class="card hero"><div class="hero-copy"><span class="pill">${icon('folder','sm')} 当前工作台</span><h2 class="h2">把事情安排好，再安心去做。</h2><p class="section-note">Will 帮你整理任务、日程与项目。本版可离线体验交互。</p>${progress(done)}<div class="metrics"><span class="metric"><strong>${m.done}/${m.total}</strong>任务完成</span><span class="metric"><strong>${m.upcoming}</strong>项近期截止</span><span class="metric"><strong>${m.overdue}</strong>项已逾期</span></div></div><div class="hero-art"><div class="planet"><i class="orbit-dot"></i></div></div></section>
<section class="card"><div class="card-head"><h2 class="h2">近期截止</h2><button class="view-all" data-nav="calendar">查看日历 ${icon('chevron','sm')}</button></div>${nearest.length?nearest.map(t=>deadlineRow(t)).join(''):'<div class="empty">暂时没有未完成的任务。你可以用加号添加一项。</div>'}<div class="dash-extra">红色时间条表示今天截止或已逾期；为首页摘要，并非完整甘特图。</div></section>
<section class="card"><div class="card-head"><h2 class="h2">待办清单</h2><button class="view-all" data-nav="projects">管理项目 ${icon('chevron','sm')}</button></div><div class="subbar"><span class="section-note">点击勾选后，完成状态和项目进度会同步更新</span><span class="count">${m.total} 项</span></div>${sortedTasks(data.tasks).slice(0,6).map(taskRow).join('')||'<div class="empty">尚无待办</div>'}</section></main><aside class="column"><section class="card"><div class="card-head"><h2 class="h2">本月日历</h2><button class="view-all" data-nav="calendar">展开 ${icon('chevron','sm')}</button></div>${calendarMarkup(false)}${agenda()}</section><section class="card"><div class="card-head"><h2 class="h2">项目概览</h2><button class="view-all" data-nav="projects">全部项目 ${icon('chevron','sm')}</button></div><div class="project-list">${projects.map(projectLine).join('')}</div></section></aside></div>`}
function deadlineRow(t){let days=Math.round((dt(t.due)-dt(nowStr))/864e5),warn=days<=0,percent=Math.max(12,Math.min(100,100- Math.max(0,days)*14));return `<div class="deadline-row"><button style="text-align:left;min-width:0" data-act="edit-task" data-id="${esc(t.id)}"><div class="deadline-title">${esc(t.title)}</div><div class="deadline-sub">${esc(project(t.projectId).name)}</div></button><div class="timeline" title="截止日期相对紧迫度示意"><span class="${warn?'danger':''}" style="width:${percent}%"></span></div><div class="deadline-at ${warn?'danger':''}">${formatShort(t.due)}<br>${esc(t.time||'全天')}</div></div>`}
function taskRow(t){return `<div class="task-row"><input type="checkbox" data-task-check="${esc(t.id)}" ${t.done?'checked':''} aria-label="完成 ${esc(t.title)}"><div class="task-label"><button class="task-title ${t.done?'done':''}" data-act="edit-task" data-id="${esc(t.id)}" style="text-align:left">${esc(t.title)}</button><div class="task-desc">${esc(project(t.projectId).name)} · ${formatShort(t.due)} ${esc(t.time||'')}</div></div><button class="ghost-btn" data-act="edit-task" data-id="${esc(t.id)}" aria-label="编辑 ${esc(t.title)}">${icon('edit','sm')}</button></div>`}
function calendarMarkup(big){let month=calendarMonth, y=month.getFullYear(),mo=month.getMonth();let start=new Date(y,mo,1),offset=(start.getDay()+6)%7,daysInMonth=new Date(y,mo+1,0).getDate(),count=big?42:35;if(daysInMonth+offset>count)count=42;let monday=dateAdd(dateStr(start),-offset);let html=`<div class="subbar"><strong style="font-size:13px">${y} 年 ${mo+1} 月</strong><div class="inline-actions"><button class="ghost-btn" data-act="cal-prev" aria-label="上个月">${icon('left','sm')}</button><button class="ghost-btn" data-act="cal-today" title="回到今天">今天</button><button class="ghost-btn" data-act="cal-next" aria-label="下个月">${icon('chevron','sm')}</button></div></div><div class="${big?'big-calendar':'calendar-days'}">`;for(let i=0;i<7;i++)html+=`<div class="weekday">${'一二三四五六日'[i]}</div>`;for(let i=0;i<count;i++){let d=dateAdd(monday,i),date=dt(d),isOther=date.getMonth()!==mo,events=data.events.filter(e=>e.date===d),tasks=data.tasks.filter(t=>t.due===d);html+=`<button class="day ${d===selectedDate?'selected':''} ${d===nowStr?'today':''} ${isOther?'faded':''}" data-day="${d}" aria-label="${d} ${events.length} 个日程 ${tasks.length} 个待办"><span class="date-num">${date.getDate()}</span>${big?`${[...events.map(x=>({t:x.title,kind:'event'})),...tasks.map(x=>({t:x.title,kind:'task',done:x.done}))].slice(0,2).map(x=>`<span class="calendar-event ${x.kind==='task'?'task':''} ${x.done?'done':''}" title="${esc(x.t)}">${esc(x.t)}</span>`).join('')}`:`<span class="markers">${events.length?'<span></span>':''}${tasks.length?'<span class="task-dot"></span>':''}</span>`}</button>`}return html+'</div>'}
function agenda(){let ev=data.events.filter(e=>e.date===selectedDate).map(e=>({...e,kind:'event',clock:e.time}));let ts=data.tasks.filter(t=>t.due===selectedDate).map(t=>({...t,kind:'task',clock:t.time||'23:59'}));let list=[...ev,...ts].sort((a,b)=>a.clock.localeCompare(b.clock));return `<div class="agenda"><div class="subbar"><strong class="smalltext">${formatShort(selectedDate)} 的安排</strong><button class="ghost-btn" data-act="new-item" title="在这一天添加">${icon('plus','sm')}</button></div>${list.length?list.map(item=>`<button class="agenda-item" style="width:100%;text-align:left" data-act="${item.kind==='event'?'edit-event':'edit-task'}" data-id="${esc(item.id)}"><span class="agenda-time">${esc(item.clock)}</span><span class="agenda-title">${esc(item.title)} ${item.kind==='task'?'· 待办':''}${item.done?' ✓':''}</span></button>`).join(''):'<div class="empty">这一天暂时没有安排。<br>可以通过 AI 助手或手动添加。</div>'}</div>`}
function projectLine(p){let x=projectMetrics(p.id);return `<button class="project-line" data-act="project-detail" data-id="${p.id}" style="text-align:left;width:100%"><div class="subbar" style="margin-bottom:4px"><span class="project-name">${esc(p.name)}</span><span class="project-count">${x.done}/${x.total} 完成</span></div>${progress(x.percent)}</button>`}
function calendarView(){return `${pageHeader('你的时间安排','选择日期可以查看对应日程和截止任务；点击事项可编辑。',`<button class="surface-btn" data-act="new-item">${icon('plus','sm')} 添加日程 / 待办</button>`)}<div class="calendar-two-col"><section class="card"><div class="card-head"><h2 class="h2">日历月视图</h2><span class="pill">点击日期</span></div>${calendarMarkup(true)}</section><section class="card"><div class="card-head"><h2 class="h2">当日详情</h2><span class="count">${formatShort(selectedDate)}</span></div>${agenda()}<p class="section-note">蓝色表示日程，红色表示任务截止。待办可以设置截止日，但不自动占用日历的工作时间段。</p></section></div>`}
function projectsView(){let m=metrics();return `${pageHeader('项目与待办',`共 ${data.tasks.length} 项任务，已完成 ${m.done} 项。点击勾选可实时更新进度。`,`<button class="surface-btn" data-act="new-item">${icon('plus','sm')} 添加待办</button>`)}<div class="project-view-grid">${projects.map(p=>{let x=projectMetrics(p.id);return `<section class="card"><div class="card-head"><div><h2 class="h2">${esc(p.name)}</h2><p class="section-note">${esc(p.description)}</p></div><span class="pill">${x.percent}%</span></div>${progress(x.percent)}<div class="project-detail-list">${sortedTasks(data.tasks.filter(t=>t.projectId===p.id)).map(taskRow).join('')||'<div class="empty">暂无任务</div>'}</div><button class="surface-btn small" data-act="new-project-task" data-id="${p.id}">${icon('plus','sm')} 添加任务</button></section>`}).join('')}</div>`}
function settingsView(){return `${pageHeader('个人设置','本页用于调整显示名称、主题和本地演示数据。')}<section class="card settings-card"><div class="card-head"><h2 class="h2">基本信息</h2><span class="pill">仅本机</span></div><form id="settings-form" class="modal-form"><div class="field"><label for="username">显示名称</label><input id="username" name="username" maxlength="24" required value="${esc(data.username)}" placeholder="你的名字"></div><div class="inline-actions"><button class="primary-btn" type="submit">保存设置</button></div></form><div class="settings-row"><div class="settings-theme"><div><h2 class="h2">显示主题</h2><p class="section-note">日间适合白天处理安排，夜间沿用当前深色工作台。</p></div><div class="theme-switch" role="group" aria-label="显示主题">${['light','night','system'].map(mode=>`<button type="button" class="${themeMode===mode?'active':''}" data-theme-option="${mode}" aria-pressed="${themeMode===mode}">${icon(themeIcon(mode),'sm')} ${themeName(mode)}</button>`).join('')}</div></div></div><div class="settings-row"><h2 class="h2">本地数据</h2><p class="section-note">任务、日程、显示名称和主题偏好会保存到当前浏览器本地存储，不会上传服务器。</p><button class="surface-btn" data-act="reset">${icon('reload','sm')} 恢复初始演示数据</button></div><div class="settings-row"><h2 class="h2">暂未接入的能力</h2><p class="section-note">登录、语音识别、图片识别、流式 LLM 响应、系统通知和跨端同步均不属于这份离线原型已实现的功能。</p></div></section>`}
function footer(){return `<footer class="statusbar"><span><b>Will / 交互原型 V0.1</b></span><span>纯前端 · HTML/CSS/JS · 可离线打开</span><span>AI 输出为预置规则模拟，无服务端连接</span><span>快捷键：<span class="kbd">Esc</span> 关闭面板</span></footer>`}
function quick(){return `<div class="fab-menu" role="menu"><button class="menu-item" data-act="open-assistant">${icon('sparkle')} AI 输入 / 文本解析</button><button class="menu-item" data-act="new-item">${icon('calendar')} 手动添加日程或待办</button><button class="menu-item" data-act="unsupported-image">${icon('image')} 图片识别 <span class="tiny muted">待接入</span></button><div class="fab-note">语音入口与真实 AI 暂未接入</div></div>`}
function renderDrawer(){if(!drawer)return '';let chatHtml=conversation.map(m=>`<div class="${m.who==='user'?'user-message':'assistant-message'}">${esc(m.text)}</div>`).join('');return `<div class="scrim" data-act="close-assistant" aria-hidden="true"></div><section class="drawer" role="dialog" aria-label="Will 助手" aria-modal="true"><header class="drawer-header"><div><div class="eyebrow">WILL ASSISTANT</div><h2 class="h2" style="margin-top:5px;font-size:20px">将想法变成安排</h2><div class="pill" style="margin-top:9px">${icon('info','sm')} 模拟识别 · 非真实 AI</div></div><button class="ghost-btn" data-act="close-assistant" aria-label="关闭">${icon('x')}</button></header><div class="drawer-scroll" id="drawer-scroll"><div class="assistant-message">把需要安排的事情告诉我。我会生成可以修改的日程或待办草案，你确认后才会保存。</div><div class="chips"><button class="chip" data-example="明天下午三点有组会，提前一小时提醒我">明天下午三点有组会，提前一小时提醒我</button><button class="chip" data-example="11月6日下午三点开项目组会，五点前提交汇报文档">11月6日下午三点开项目组会，五点前提交汇报文档</button><button class="chip" data-example="11月6日下午三点有校园讲座，五点前提交报名表">11月6日下午三点有校园讲座，五点前提交报名表</button></div>${chatHtml}${processing?`<div class="assistant-message">正在模拟解析，请稍候…</div>`:''}${pending.length?`<div class="assistant-message">已生成 ${pending.length} 项可编辑安排。检查后再确认保存。</div>${pending.map((d,i)=>draftCard(d,i)).join('')}<div class="inline-actions"><button class="primary-btn" data-act="confirm-drafts">${icon('check','sm')} 确认添加 ${pending.length} 项</button><button class="surface-btn" data-act="discard-drafts">取消</button></div>`:''}<p class="notice">注意：本原型使用本地规则模拟信息提取，仅验证交互。正式版应由服务端提供识别结果，并进行权限和数据校验。</p></div><div class="drawer-footer"><label class="sr-only" for="composer">输入任务</label><textarea id="composer" class="composer" placeholder="例如：明天下午三点开组会…" ${processing?'disabled':''}>${esc(composerText)}</textarea><div class="compose-actions"><span class="compose-help">Ctrl + Enter 发送</span><button class="primary-btn" data-act="send" ${processing?'disabled':''}>发送 ${icon('send','sm')}</button></div></div></section>`}
function draftCard(d,i){return `<div class="draft-card"><div class="subbar"><strong style="font-size:13px">安排 ${i+1}</strong><span class="tag">${d.kind==='event'?'日程':'待办'}</span></div><div class="field"><label>标题</label><input data-draft="${i}" data-key="title" maxlength="80" value="${esc(d.title)}"></div><div class="field-grid"><div class="field"><label>${d.kind==='event'?'开始日期':'截止日期'}</label><input data-draft="${i}" data-key="date" type="date" value="${esc(d.date)}"></div><div class="field"><label>${d.kind==='event'?'开始时间':'截止时间'}</label><input data-draft="${i}" data-key="time" type="time" value="${esc(d.time)}"></div></div><div class="field-grid"><div class="field"><label>类别</label><select data-draft="${i}" data-key="kind"><option value="event" ${d.kind==='event'?'selected':''}>日程</option><option value="task" ${d.kind==='task'?'selected':''}>待办</option></select></div><div class="field"><label>关联项目</label><select data-draft="${i}" data-key="projectId">${projectOptions(d.projectId)}</select></div></div>${d.kind==='event'?`<div class="field"><label>提前提醒</label><select data-draft="${i}" data-key="remind"><option value="0" ${Number(d.remind)===0?'selected':''}>不提醒</option><option value="10" ${Number(d.remind)===10?'selected':''}>10 分钟</option><option value="30" ${Number(d.remind)===30?'selected':''}>30 分钟</option><option value="60" ${Number(d.remind)===60?'selected':''}>1 小时</option></select></div>`:''}<button class="ghost-btn small" style="align-self:flex-end" data-act="drop-draft" data-index="${i}">${icon('x','sm')} 移除此项</button></div>`}
function projectOptions(current){return projects.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${esc(p.name)}</option>`).join('')}
function renderModal(){if(!dialog)return '';if(dialog.kind==='help')return `<div class="modal-wrap" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 class="h2" id="modal-title">原型使用说明</h2><button class="ghost-btn" data-act="close-modal" aria-label="关闭">${icon('x')}</button></div><p class="section-note">这是一份供评审交互逻辑的离线原型，数据和 AI 解析均为本地模拟。</p><ol style="line-height:2;font-size:13px;padding-left:20px"><li>点击右下角加号，选择 AI 输入。</li><li>点击示例语句或自行输入，生成可修改的日程 / 待办草案。</li><li>确认保存后，到日历和待办中验证内容是否同步出现。</li><li>点击任务勾选完成，观察项目进度变化；点击条目可以编辑或删除。</li><li>打开“设置”可以修改称呼；所有修改会保存在本机。</li></ol><p class="section-note">不包含真实 LLM、服务端鉴权、语音和图片识别。真实服务端协议由项目组另行确定。</p><div class="inline-actions" style="justify-content:flex-end;margin-top:20px"><button class="primary-btn" data-act="close-modal">开始体验</button></div></div></div>`;
let x=dialog.item||{},isTask=dialog.kind==='task',isNew=dialog.new;return `<div class="modal-wrap" data-act="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 class="h2" id="modal-title">${isNew?'添加':'编辑'}${isTask?'待办':'日程'}</h2><button class="ghost-btn" data-act="close-modal" aria-label="关闭">${icon('x')}</button></div><form id="item-form" class="modal-form"><input name="originalId" type="hidden" value="${esc(x.id||'')}"><div class="field"><label for="item-title">事项标题</label><input id="item-title" name="title" maxlength="80" required value="${esc(x.title||'')}"></div><div class="field"><label for="item-kind">类型</label><select name="kind" id="item-kind"><option value="task" ${isTask?'selected':''}>待办</option><option value="event" ${!isTask?'selected':''}>日程</option></select></div><div class="field-grid"><div class="field"><label for="item-date">${isTask?'截止日期':'安排日期'}</label><input id="item-date" name="date" type="date" required value="${esc(x.due||x.date||selectedDate)}"></div><div class="field"><label for="item-time">时间</label><input id="item-time" name="time" type="time" required value="${esc(x.time||'15:00')}"></div></div><div class="field"><label for="item-project">关联项目</label><select id="item-project" name="projectId">${projectOptions(x.projectId||'will')}</select></div>${!isTask?`<div class="field"><label for="item-remind">提前提醒</label><select id="item-remind" name="remind"><option value="0" ${Number(x.remind||0)===0?'selected':''}>不提醒</option><option value="10" ${Number(x.remind)===10?'selected':''}>10 分钟</option><option value="30" ${Number(x.remind)===30?'selected':''}>30 分钟</option><option value="60" ${Number(x.remind)===60?'selected':''}>1 小时</option></select></div>`:''}<div class="modal-foot"><div>${!isNew?`<button type="button" class="danger-btn" data-act="delete-item" data-id="${esc(x.id)}">删除此项</button>`:''}</div><div class="inline-actions"><button type="button" class="surface-btn" data-act="close-modal">取消</button><button type="submit" class="primary-btn">保存</button></div></div></form></section></div>`}
function render(){el.innerHTML=`<div class="app">${nav()}<div class="workspace">${top()}${({home,calendar:calendarView,projects:projectsView,settings:settingsView}[view]||home)()}${footer()}</div></div>${plusMenu?quick():''}${!drawer?`<button class="fab" data-act="toggle-plus">${icon('plus')} 快速添加</button>`:''}${renderDrawer()}`;portal.innerHTML=renderModal()}
function toast(s){let node=document.getElementById('toast');node.textContent=s;node.classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>node.classList.add('hide'),2700)}
function changeView(v){view=v;plusMenu=false;drawer=false;render();window.scrollTo(0,0)}
function openDialog(kind,item=null,pid='will'){dialog={kind,item:item?{...item}:{date:selectedDate,due:selectedDate,time:'15:00',projectId:pid},new:!item};drawer=false;plusMenu=false;render()}
function chineseNum(s){const map={零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};if(/^\d+$/.test(s))return +s;if(s==='十')return 10;if(s.startsWith('十'))return 10+(map[s[1]]||0);if(s.includes('十')){let [a,b]=s.split('十');return (map[a]||1)*10+(map[b]||0)}return map[s]||0}
function getDateFromText(text){let s=text.match(/(?:(\d{4})\s*年\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);if(s){let y=s[1]?+s[1]:TODAY.getFullYear(),mo=+s[2],day=+s[3];if(mo>=1&&mo<=12&&day>=1&&day<=31){let d=new Date(y,mo-1,day);if(d.getMonth()===mo-1)return dateStr(d)}}if(/大后天/.test(text))return dateAdd(nowStr,3);if(/后天/.test(text))return dateAdd(nowStr,2);if(/明天/.test(text))return dateAdd(nowStr,1);if(/今天|今晚/.test(text))return nowStr;let m=text.match(/(?:下)?(?:周|星期|礼拜)([一二三四五六日天])/);if(m){let target='一二三四五六日天'.indexOf(m[1])+1;if(target===8)target=7;let w=(TODAY.getDay()+6)%7+1,delta=(target-w+7)%7;return dateAdd(nowStr,delta+(m[0].startsWith('下')?7:0))}return dateAdd(nowStr,1)}
function extractTimes(s){let result=[];let pat=/(上午|下午|早上|中午|晚上|晚间|凌晨)?\s*([零一二两三四五六七八九十\d]{1,3})\s*(?:点|时)(?:半|\s*([零一二两三四五六七八九十\d]{1,3})\s*分?)?/g;let m;while((m=pat.exec(s))){let hour=chineseNum(m[2]),mins=m[0].includes('半')?30:(m[3]?chineseNum(m[3]):0);if(/下午|晚上|晚间/.test(m[1]||'')&&hour<12)hour+=12;if(/凌晨/.test(m[1]||'')&&hour===12)hour=0;if(hour>23||mins>59)continue;result.push({pos:m.index,time:`${String(hour).padStart(2,'0')}:${String(mins).padStart(2,'0')}`,raw:m[0]})}let numeric=/\b(\d{1,2}):(\d{2})\b/g;while((m=numeric.exec(s))){if(+m[1]<24&&+m[2]<60)result.push({pos:m.index,time:`${m[1].padStart(2,'0')}:${m[2]}`,raw:m[0]})}return result.sort((a,b)=>a.pos-b.pos)}
function mockExtract(s){let date=getDateFromText(s),times=extractTimes(s),hasEvent=/会议|组会|开会|讲座|上课|面试|约见|约会/.test(s),hasTask=/提交|汇报文档|报告|作业|待办|完成|整理|截止|报名表/.test(s)||(!hasEvent&&/提醒/.test(s));let drafts=[];let eventTitle=/组会/.test(s)?'项目组会':/面试/.test(s)?'面试':/讲座/.test(s)?'参加讲座':/上课/.test(s)?'课程安排':/会议|开会/.test(s)?'会议':'日程安排';if(hasEvent){drafts.push({kind:'event',title:eventTitle,date,time:times[0]?.time||'15:00',projectId:'will',remind:/提前(?:一|1)\s*小时/.test(s)?60:/提前(?:半小时|30\s*分钟)/.test(s)?30:0})}
if(hasTask){let title=/汇报文档/.test(s)?'提交汇报文档':/报名表/.test(s)?'提交报名表':/课程报告/.test(s)?'提交课程报告':/作业/.test(s)?'完成作业':/报告/.test(s)?'提交报告':/整理/.test(s)?'整理资料':/提醒/.test(s)?'提醒事项':'待办任务';let taskTime=times[hasEvent?1:0]?.time||(/五点前/.test(s)?'17:00':'18:00');if(/五点前/.test(s)&&hasEvent&&/下午|晚上/.test(s)&&taskTime==='05:00')taskTime='17:00';if(/五点前/.test(s)&&!times[1]&&hasEvent)taskTime='17:00';drafts.push({kind:'task',title,date,time:taskTime,projectId:/课程|作业/.test(s)?'course':'will'})}
if(drafts.length===0){let clean=s.replace(/\s+/g,' ').trim();drafts.push({kind:'task',title:clean.slice(0,32)||'新待办',date,time:times[0]?.time||'18:00',projectId:'personal'})}return drafts}
function send(){if(processing)return;let box=document.getElementById('composer');let raw=(box?box.value:composerText).trim();if(!raw){toast('先输入要安排的事情。');box?.focus();return}conversation.push({who:'user',text:raw});composerText='';pending=[];pendingSource=raw;processing=true;render();setTimeout(()=>{processing=false;pending=mockExtract(raw);conversation.push({who:'assistant',text:'我先整理出一个可编辑的安排草案。这里采用本地模拟规则，内容请自行核对。'});render();const scr=document.getElementById('drawer-scroll');if(scr)scr.scrollTop=scr.scrollHeight},380)}
function confirmDrafts(){if(!pending.length)return;for(const d of pending){if(!d.title.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!/^\d{2}:\d{2}$/.test(d.time)){toast('请补全草案标题、日期和时间。');return}}for(const d of pending){if(d.kind==='event'){data.events.push({id:id(),title:d.title.trim(),date:d.date,time:d.time,duration:60,projectId:d.projectId,remind:Number(d.remind||0)})}else{data.tasks.push({id:id(),title:d.title.trim(),due:d.date,time:d.time,projectId:d.projectId,done:false})}}let n=pending.length;selectedDate=pending[0].date;calendarMonth=new Date(dt(selectedDate).getFullYear(),dt(selectedDate).getMonth(),1);pending=[];conversation.push({who:'assistant',text:`已添加 ${n} 项安排。现在可以到日历或待办区查看、修改和勾选。`});persist();render();toast(`已保存 ${n} 项到本地演示数据`)}
function action(act,btn){switch(act){case'open-assistant':drawer=true;plusMenu=false;render();setTimeout(()=>document.getElementById('composer')?.focus(),0);break;case'close-assistant':drawer=false;render();break;case'toggle-plus':plusMenu=!plusMenu;render();break;case'cycle-theme':setTheme({system:'light',light:'night',night:'system'}[themeMode]||'system');break;case'new-item':openDialog('task');break;case'new-project-task':openDialog('task',null,btn.dataset.id);break;case'edit-task':{let item=data.tasks.find(x=>x.id===btn.dataset.id);if(item)openDialog('task',item);break}case'edit-event':{let item=data.events.find(x=>x.id===btn.dataset.id);if(item)openDialog('event',item);break}case'project-detail':view='projects';render();window.scrollTo(0,0);break;case'cal-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();break;case'cal-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();break;case'cal-today':calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);selectedDate=nowStr;render();break;case'show-help':dialog={kind:'help'};render();break;case'close-modal':dialog=null;render();break;case'unsupported-image':plusMenu=false;render();toast('图片识别与语音输入将在连接真实 AI 服务后实现。');break;case'drop-draft':pending.splice(+btn.dataset.index,1);render();break;case'discard-drafts':pending=[];render();toast('已取消这次创建，没有修改日程。');break;case'confirm-drafts':confirmDrafts();break;case'send':send();break;case'reset':if(confirm('将清除本机所有修改并恢复预置演示数据，确定吗？')){data=seed();persist();selectedDate=nowStr;calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);conversation=[];pending=[];drawer=false;plusMenu=false;view='home';render();toast('已恢复初始演示数据')}break;case'delete-item':{let i=btn.dataset.id;if(confirm('确定删除这个事项吗？')){data.tasks=data.tasks.filter(x=>x.id!==i);data.events=data.events.filter(x=>x.id!==i);dialog=null;persist();render();toast('事项已删除')}break}default:break}}
 document.addEventListener('click',e=>{const themeOption=e.target.closest('[data-theme-option]');if(themeOption){setTheme(themeOption.dataset.themeOption);return}const navTarget=e.target.closest('[data-nav]');if(navTarget){changeView(navTarget.dataset.nav);return}const day=e.target.closest('[data-day]');if(day){selectedDate=day.dataset.day;let d=dt(selectedDate);if(d.getMonth()!==calendarMonth.getMonth()||d.getFullYear()!==calendarMonth.getFullYear())calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);render();return}const ex=e.target.closest('[data-example]');if(ex){composerText=ex.dataset.example;render();document.getElementById('composer')?.focus();return}const act=e.target.closest('[data-act]');if(act){if(act.dataset.act==='close-modal'&&e.target.closest('.modal')&&e.target!==act)return;action(act.dataset.act,act);return}if(plusMenu&&!e.target.closest('.fab-menu')){plusMenu=false;render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-task-check]')){let t=data.tasks.find(x=>x.id===e.target.dataset.taskCheck);if(t){t.done=e.target.checked;persist();render();toast(t.done?'任务已完成，项目进度已更新':'任务已恢复为未完成')}return}if(e.target.matches('[data-draft]')){let i=+e.target.dataset.draft,k=e.target.dataset.key;if(pending[i]){pending[i][k]=e.target.value;if(k==='kind')render()}}});
document.addEventListener('input',e=>{if(e.target.id==='composer')composerText=e.target.value;if(e.target.matches('[data-draft]')){let i=+e.target.dataset.draft,k=e.target.dataset.key;if(pending[i])pending[i][k]=e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='settings-form'){e.preventDefault();let val=new FormData(e.target).get('username').toString().trim();if(!val){toast('请输入显示名称');return}data.username=val;persist();render();toast('称呼已保存');return}if(e.target.id==='item-form'){e.preventDefault();let f=new FormData(e.target),kind=f.get('kind'),title=f.get('title').toString().trim(),date=f.get('date').toString(),time=f.get('time').toString(),pid=f.get('projectId'),oid=f.get('originalId');if(!title||!date||!time){toast('请完整填写标题、日期和时间');return}if(oid){data.tasks=data.tasks.filter(x=>x.id!==oid);data.events=data.events.filter(x=>x.id!==oid)}if(kind==='task'){data.tasks.push({id:oid||id(),title,due:date,time,projectId:pid,done:dialog?.kind==='task'&&dialog.item?.done||false})}else{data.events.push({id:oid||id(),title,date,time,projectId:pid,duration:60,remind:Number(f.get('remind')||0)})}selectedDate=date;calendarMonth=new Date(dt(date).getFullYear(),dt(date).getMonth(),1);dialog=null;persist();render();toast('事项已保存，日历和任务区已同步')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialog){dialog=null;render()}else if(drawer){drawer=false;render()}else if(plusMenu){plusMenu=false;render()}}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='composer'){e.preventDefault();send()}});
render();
})();
</script>
</body>
